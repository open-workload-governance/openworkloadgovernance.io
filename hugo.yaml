baseURL: https://openworkloadgovernance.io/
title: Open Workload Governance
languageCode: en-us
defaultContentLanguage: en
contentDir: content/en
enableRobotsTXT: true
disableKinds: [taxonomy, term]

module:
  imports:
    - path: github.com/google/docsy
  mounts:
    - source: static
      target: static
    - source: examples
      target: static/examples

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    style: friendly
  tableOfContents:
    startLevel: 2
    endLevel: 3

params:
  description: A vendor-neutral proposal for workload governance ownership and accountability.
  offlineSearch: true
  prism_syntax_highlighting: false
  ui:
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    breadcrumb_disable: false
    feedback:
      enable: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 10
    - name: Specification
      pageRef: /docs/specification
      weight: 20
    - name: Project
      pageRef: /project
      weight: 30
